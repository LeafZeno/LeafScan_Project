<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login - LeafScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
  </head>
  <body
    class="bg-slate-950 text-white min-h-screen flex items-center justify-center"
  >
    <div
      class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8"
    >
      <h1 class="text-3xl font-bold mb-2 text-green-400">Login</h1>
      <p class="text-slate-400 mb-6">Sign in to your LeafScan account</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block mb-2 text-sm text-slate-300">Email</label>
          <input
            id="email"
            type="email"
            required
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3"
          />
        </div>

        <div>
          <label class="block mb-2 text-sm text-slate-300">Password</label>
          <input
            id="password"
            type="password"
            required
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3"
          />
        </div>

        <button
          type="submit"
          class="w-full px-4 py-3 rounded-xl bg-green-600 hover:bg-green-700 font-medium"
        >
          Login
        </button>
      </form>

      <p id="message" class="mt-4 text-sm"></p>

      <p class="mt-6 text-slate-400 text-sm">
        Don’t have an account?
        <a href="register.html" class="text-green-400 hover:underline"
          >Register</a
        >
      </p>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          console.log(error);
          message.textContent = error.message;
          message.className = "mt-4 text-sm text-red-400";
          return;
        }

        message.textContent = "Login successful.";
        message.className = "mt-4 text-sm text-green-400";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 600);
      });
    </script>
  </body>
</html>
