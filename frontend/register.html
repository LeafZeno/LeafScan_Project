<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register - LeafScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
  </head>
  <body
    class="bg-slate-950 text-white min-h-screen flex items-center justify-center"
  >
    <div
      class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8"
    >
      <h1 class="text-3xl font-bold mb-2 text-green-400">Register</h1>
      <p class="text-slate-400 mb-6">Create your LeafScan account</p>

      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block mb-2 text-sm text-slate-300">Full Name</label>
          <input
            id="fullName"
            type="text"
            required
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3"
          />
        </div>

        <div>
          <label class="block mb-2 text-sm text-slate-300">Email</label>
          <input
            id="email"
            type="email"
            required
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3"
          />
        </div>

        <div>
          <label class="block mb-2 text-sm text-slate-300">Password</label>
          <input
            id="password"
            type="password"
            required
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3"
          />
        </div>

        <button
          type="submit"
          class="w-full px-4 py-3 rounded-xl bg-green-600 hover:bg-green-700 font-medium"
        >
          Register
        </button>
      </form>

      <p id="message" class="mt-4 text-sm"></p>

      <p class="mt-6 text-slate-400 text-sm">
        Already have an account?
        <a href="login.html" class="text-green-400 hover:underline">Login</a>
      </p>
    </div>

    <script>
      const form = document.getElementById("registerForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const fullNameInput = document.getElementById("fullName");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        const fullName = fullNameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        console.log("Register fullName:", fullName);
        console.log("Register email:", email);

        if (!fullName) {
          message.textContent = "Full name is required.";
          message.className = "mt-4 text-sm text-red-400";
          return;
        }

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
            },
          },
        });

        if (error) {
          console.log("Sign up error:", error);
          message.textContent = error.message;
          message.className = "mt-4 text-sm text-red-400";
          return;
        }

        const user = data.user;

        if (user) {
          const { error: profileError } = await supabaseClient
            .from("profiles")
            .upsert({
              id: user.id,
              email: user.email,
              full_name: fullName,
              role: "user",
            });

          if (profileError) {
            console.log("Profile insert error:", profileError);
            message.textContent = "Account created, but profile insert failed.";
            message.className = "mt-4 text-sm text-red-400";
            return;
          }
        }

        message.textContent = "Registration successful. You can now login.";
        message.className = "mt-4 text-sm text-green-400";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 800);
      });
    </script>
  </body>
</html>
