<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>All Plants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
  </head>
  <body class="bg-slate-950 text-white min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">🌿 All Plants</h1>

        <a
          href="index.html"
          class="bg-slate-700 px-4 py-2 rounded hover:bg-slate-600"
        >
          Back
        </a>
      </div>

      <!-- Search -->
      <input
        id="searchInput"
        placeholder="Search plant..."
        class="w-full mb-6 p-3 rounded bg-slate-800 border border-slate-700"
      />

      <div
        id="grid"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
      ></div>

      <p id="loading">Loading plants...</p>
      <p id="error" class="text-red-400 hidden"></p>
    </div>

    <script>
      const grid = document.getElementById("grid");
      const loading = document.getElementById("loading");
      const errorBox = document.getElementById("error");
      const searchInput = document.getElementById("searchInput");

      let plants = [];

      function render(data) {
        grid.innerHTML = "";

        data.forEach((p) => {
          const card = document.createElement("a");
          card.href = `plant.html?name=${encodeURIComponent(p.model_label)}`;
          card.className =
            "bg-slate-800 rounded-xl overflow-hidden hover:bg-slate-700";

          card.innerHTML = `
          <img src="${p.image_url}" class="w-full h-48 object-cover">
          <div class="p-3">
            <h2 class="text-lg font-semibold">${p.name}</h2>
            <p class="text-sm text-slate-400">${p.scientific_name || ""}</p>
          </div>
        `;

          grid.appendChild(card);
        });
      }

      searchInput.addEventListener("input", () => {
        const keyword = searchInput.value.toLowerCase();

        const filtered = plants.filter((p) =>
          (p.name || "").toLowerCase().includes(keyword),
        );

        render(filtered);
      });

      async function loadPlants() {
        const { data, error } = await supabaseClient
          .from("plants")
          .select("*")
          .eq("is_active", true);

        loading.style.display = "none";

        if (error) {
          errorBox.textContent = "Failed to load plants";
          errorBox.classList.remove("hidden");
          return;
        }

        plants = data;
        render(plants);
      }

      loadPlants();
    </script>
  </body>
</html>
