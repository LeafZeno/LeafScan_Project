<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plant Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <a href="index.html" class="text-2xl font-bold text-green-400">LeafScan</a>

      <div class="flex items-center gap-3">
        <a
          href="index.html"
          class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700"
        >
          Home
        </a>
        <a
          href="plants.html"
          class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700"
        >
          Browse Plants
        </a>
        <a
          href="scan.html"
          class="px-4 py-2 rounded-lg bg-green-600 hover:bg-green-700"
        >
          Scan Plant
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <button
      onclick="history.back()"
      class="mb-6 px-4 py-2 bg-slate-800 rounded-lg hover:bg-slate-700"
    >
      Back
    </button>

    <div id="loading" class="text-slate-300">Loading plant details...</div>
    <div id="error" class="hidden text-red-400"></div>

    <div id="pageContent" class="hidden">
      <!-- Hero Section -->
      <section class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
        <div class="order-2 lg:order-1">
          <div class="flex flex-wrap gap-3 mb-4">
            <span
              id="categoryBadge"
              class="hidden px-4 py-2 rounded-full bg-green-600/20 text-green-300 border border-green-500/30 text-sm"
            ></span>
          </div>

          <h1 id="plantName" class="text-4xl md:text-5xl font-bold mb-3"></h1>
          <p id="scientificName" class="text-slate-300 italic text-lg mb-5"></p>

          <p id="description" class="text-slate-200 leading-8 text-lg"></p>

          <div class="mt-6 flex flex-wrap gap-3">
            <a
              href="scan.html"
              class="px-5 py-3 rounded-xl bg-green-600 hover:bg-green-700 font-medium"
            >
              Scan Another Plant
            </a>
            <a
              href="plants.html"
              class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 font-medium"
            >
              Browse More Plants
            </a>
          </div>
        </div>

        <div class="order-1 lg:order-2">
          <img
            id="mainImage"
            src=""
            alt="Plant image"
            class="w-full h-[320px] md:h-[440px] object-cover rounded-3xl border border-slate-800 bg-slate-900"
          />
        </div>
      </section>

      <!-- Info Blocks -->
      <section class="mb-10">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-4xl mx-auto">
          <h2 class="text-2xl font-bold mb-4">Care Instructions</h2>
          <p id="careInstructions" class="text-slate-200 leading-8 whitespace-pre-line">
            No care instructions available yet.
          </p>
          <button
            id="favoriteBtn"
            class="mt-4 px-4 py-2 bg-yellow-500 rounded hover:bg-yellow-600 text-slate-950 font-medium"
          >
            Add to Favorites
          </button>
        </div>
      </section>

      <!-- Reference Images -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-10">
        <h2 class="text-2xl font-bold mb-5">Reference Images</h2>
        <div
          id="imageGallery"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
        ></div>
      </section>

      <!-- Related Plants -->
      <section class="mb-6">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-2xl font-bold">Related Plants</h2>
          <a href="plants.html" class="text-green-400 hover:underline">See all</a>
        </div>

        <div
          id="relatedPlants"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"
        ></div>

        <p id="relatedEmpty" class="hidden text-slate-400">
          No related plants found yet.
        </p>
      </section>
    </div>
  </main>

  <script>
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const pageContent = document.getElementById("pageContent");

    const plantNameEl = document.getElementById("plantName");
    const scientificNameEl = document.getElementById("scientificName");
    const descriptionEl = document.getElementById("description");
    const careInstructionsEl = document.getElementById("careInstructions");
    const mainImageEl = document.getElementById("mainImage");
    const imageGallery = document.getElementById("imageGallery");
    const categoryBadge = document.getElementById("categoryBadge");
    const relatedPlantsEl = document.getElementById("relatedPlants");
    const relatedEmptyEl = document.getElementById("relatedEmpty");

    function createRelatedCard(plant) {
      const card = document.createElement("a");
      card.href = `plant.html?id=${plant.id}`;
      card.className =
        "block bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:bg-slate-800 transition";

      card.innerHTML = `
        <img
          src="${plant.image_url || ""}"
          alt="${plant.name || "Plant"}"
          class="w-full h-44 object-cover bg-slate-800"
        />
        <div class="p-4">
          <h3 class="text-lg font-semibold">${plant.name || "Unnamed plant"}</h3>
          <p class="text-sm text-slate-400 italic mt-1">${plant.scientific_name || ""}</p>
        </div>
      `;

      return card;
    }

    async function setupFavoriteButton(plantId) {
      const favoriteBtn = document.getElementById("favoriteBtn");
      const { data: { user } } = await supabaseClient.auth.getUser();

      if (!user) {
        favoriteBtn.textContent = "Login to Save Favorite";
        favoriteBtn.className = "mt-4 px-4 py-2 bg-slate-700 rounded hover:bg-slate-600";
        favoriteBtn.onclick = () => {
          window.location.href = "login.html";
        };
        return;
      }

      const { data: existingFavorite, error: checkError } = await supabaseClient
        .from("favorites")
        .select("id")
        .eq("user_id", user.id)
        .eq("plant_id", plantId)
        .maybeSingle();

      if (checkError) {
        console.log("Favorite check error:", checkError);
        favoriteBtn.textContent = "Favorite Unavailable";
        favoriteBtn.className = "mt-4 px-4 py-2 bg-slate-700 rounded";
        return;
      }

      if (existingFavorite) {
        favoriteBtn.textContent = "Remove from Favorites";
        favoriteBtn.className = "mt-4 px-4 py-2 bg-red-600 rounded hover:bg-red-700";

        favoriteBtn.onclick = async () => {
          const { error } = await supabaseClient
            .from("favorites")
            .delete()
            .eq("id", existingFavorite.id);

          if (error) {
            console.log("Remove favorite error:", error);
            alert("Failed to remove favorite.");
          } else {
            alert("Removed from favorites.");
            await setupFavoriteButton(plantId);
          }
        };
      } else {
        favoriteBtn.textContent = "Add to Favorites";
        favoriteBtn.className = "mt-4 px-4 py-2 bg-yellow-500 rounded hover:bg-yellow-600 text-slate-950 font-medium";

        favoriteBtn.onclick = async () => {
          const { data: { user } } = await supabaseClient.auth.getUser();

          if (!user) {
            alert("Please login first");
            return;
          }

          const { error } = await supabaseClient
            .from("favorites")
            .insert({
              user_id: user.id,
              plant_id: plantId
            });

          if (error) {
            console.log("Add favorite error:", error);
            alert("Failed to add favorite.");
          } else {
            alert("Added to favorites!");
            await setupFavoriteButton(plantId);
          }
        };
      }
    }

    async function loadPlant() {
      try {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          loading.classList.add("hidden");
          errorBox.textContent = "Plant id is missing in URL.";
          errorBox.classList.remove("hidden");
          return;
        }

        const { data: plant, error: plantError } = await supabaseClient
          .from("plants")
          .select("*")
          .eq("id", id)
          .single();

        if (plantError || !plant) {
          console.log("Plant query error:", plantError);
          loading.classList.add("hidden");
          errorBox.textContent = "Plant not found.";
          errorBox.classList.remove("hidden");
          return;
        }

        // Category
        let categoryName = "";
        if (plant.category_id) {
          const { data: categoryData } = await supabaseClient
            .from("categories")
            .select("name")
            .eq("id", plant.category_id)
            .single();

          categoryName = categoryData?.name || "";
        }

        // Images
        const { data: images, error: imageError } = await supabaseClient
          .from("plant_images")
          .select("*")
          .eq("plant_id", plant.id)
          .order("sort_order", { ascending: true });

        if (imageError) {
          console.log("Image query error:", imageError);
        }

        // Related plants
        let relatedPlants = [];
        if (plant.category_id) {
          const { data: relatedData, error: relatedError } = await supabaseClient
            .from("plants")
            .select("*")
            .eq("category_id", plant.category_id)
            .neq("id", plant.id)
            .eq("is_active", true)
            .limit(4);

          if (!relatedError && relatedData) {
            relatedPlants = relatedData;
          }
        }

        // Fill content
        plantNameEl.textContent = plant.name || "Unknown plant";
        scientificNameEl.textContent = plant.scientific_name || "";
        descriptionEl.textContent = plant.description || "No description available.";
        careInstructionsEl.textContent =
          plant.care_instructions || "No care instructions available yet.";

        await setupFavoriteButton(plant.id);

        if (categoryName) {
          categoryBadge.textContent = categoryName;
          categoryBadge.classList.remove("hidden");
        }

        const mainImage =
          plant.image_url ||
          (images && images.length > 0 ? images[0].image_url : "");

        mainImageEl.src = mainImage;
        mainImageEl.alt = plant.name || "Plant image";

        // Gallery
        imageGallery.innerHTML = "";

        if (images && images.length > 0) {
          images.forEach((img) => {
            const image = document.createElement("img");
            image.src = img.image_url;
            image.alt = plant.name || "Plant image";
            image.className =
              "w-full h-60 object-cover rounded-xl bg-slate-800 border border-slate-800";
            imageGallery.appendChild(image);
          });
        } else if (plant.image_url) {
          const image = document.createElement("img");
          image.src = plant.image_url;
          image.alt = plant.name || "Plant image";
          image.className =
            "w-full h-60 object-cover rounded-xl bg-slate-800 border border-slate-800";
          imageGallery.appendChild(image);
        } else {
          imageGallery.innerHTML =
            "<p class='text-slate-400'>No reference images available.</p>";
        }

        // Related plants
        relatedPlantsEl.innerHTML = "";
        if (relatedPlants.length > 0) {
          relatedEmptyEl.classList.add("hidden");
          relatedPlants.forEach((relatedPlant) => {
            relatedPlantsEl.appendChild(createRelatedCard(relatedPlant));
          });
        } else {
          relatedEmptyEl.classList.remove("hidden");
        }

        loading.classList.add("hidden");
        pageContent.classList.remove("hidden");
      } catch (err) {
        console.log("Unexpected error:", err);
        loading.classList.add("hidden");
        errorBox.textContent = "Something went wrong while loading plant details.";
        errorBox.classList.remove("hidden");
      }
    }

    loadPlant();
  </script>
</body>
</html>
