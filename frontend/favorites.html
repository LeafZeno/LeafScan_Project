<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Favorites - LeafScan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-green-400">LeafScan</a>

      <div class="flex gap-3">
        <a href="profile.html" class="px-4 py-2 bg-slate-800 rounded hover:bg-slate-700">
          Profile
        </a>
        <button onclick="signOutUser()" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">

    <h1 class="text-3xl font-bold mb-6">My Favorite Plants</h1>

    <div id="loading">Loading favorites...</div>
    <div id="empty" class="hidden text-slate-400">No favorites yet.</div>

    <div id="grid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

  </main>

  <script>
    const loading = document.getElementById("loading");
    const empty = document.getElementById("empty");
    const grid = document.getElementById("grid");

    function createCard(plant) {
      const card = document.createElement("a");
      card.href = `plant.html?id=${plant.id}`;
      card.className = "block bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:bg-slate-800";

      card.innerHTML = `
        <img src="${plant.image_url || ""}" class="w-full h-44 object-cover bg-slate-800"/>
        <div class="p-3">
          <h2 class="font-semibold">${plant.name}</h2>
          <p class="text-sm text-slate-400 italic">${plant.scientific_name || ""}</p>
        </div>
      `;

      return card;
    }

    async function loadFavorites() {
      const user = await requireAuth("login.html");
      if (!user) return;

      const { data, error } = await supabaseClient
        .from("favorites")
        .select(`
          plant_id,
          plants (
            id,
            name,
            scientific_name,
            image_url
          )
        `)
        .eq("user_id", user.id);

      loading.classList.add("hidden");

      if (error) {
        console.log(error);
        return;
      }

      if (!data || data.length === 0) {
        empty.classList.remove("hidden");
        return;
      }

      grid.classList.remove("hidden");

      data.forEach(item => {
        if (item.plants) {
          grid.appendChild(createCard(item.plants));
        }
      });
    }

    loadFavorites();
  </script>

</body>
</html>
